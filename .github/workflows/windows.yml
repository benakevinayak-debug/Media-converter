name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-desktop-1.2, codex/desktop-purple-1.3, codex/windows-settings-1.3.2]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:render
      - run: node scripts/capture-asset-notices.cjs
      - run: npm run dist:win -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged asset dependencies
        run: node scripts/verify-packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: MediaConvert-Windows-installer
          path: dist/*.exe
          if-no-files-found: error
