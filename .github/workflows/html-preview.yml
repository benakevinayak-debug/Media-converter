name: Download HTML preview
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-desktop-1.2, codex/desktop-purple-1.3, codex/windows-settings-1.3.2]
    paths:
      - preview/**
      - .github/workflows/html-preview.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: MediaConvert-HTML-Preview
          path: preview/MediaConvert-Preview.html
          if-no-files-found: error
